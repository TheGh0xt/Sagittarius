name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit."; exit 1; }

      - name: Build
        run: go build ./...

      # go vet is the static analysis gate here. golangci-lint is deliberately
      # absent: its released binaries are built with Go 1.24 and refuse a
      # go.mod targeting 1.26.2 ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"). Restore the
      # lint job once golangci-lint ships a Go 1.26 build.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t sagittarius:ci .

      - name: Smoke-test /health
        run: |
          docker run -d --name sagittarius-ci -p 8080:8080 sagittarius:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "health check passed"
              docker rm -f sagittarius-ci
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs sagittarius-ci
          docker rm -f sagittarius-ci
          exit 1
